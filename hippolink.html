<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>HippoLink</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single-look dark device screen (HippoLink terminal): status card on top, one panel per tab, fixed bottom tab bar; instability shows as noise */
:root{
  color-scheme:dark;
  --bg:#121014;--panel:#1b181e;--panel2:#241f27;--fg:#efe8f1;--muted:#9a8f9e;--line:#332c36;
  --accent:#e08aad;--accent-dim:#5a2a3e;--ok:#78d1a5;--warn:#f0c46a;--bad:#ff6b78;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--mono);letter-spacing:.18em;font-size:.82rem}
.brand b{color:var(--accent);font-weight:500}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who span{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.icon-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.8rem;color:var(--muted)}

.status{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.status .lbl{font-size:.75rem;color:var(--muted);letter-spacing:.12em}
.bal{font-family:var(--mono);font-size:2.2rem;font-weight:500;line-height:1.2;margin:2px 0 10px}
.bal small{font-size:.9rem;color:var(--muted);margin-left:6px}
.row2{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.row2 b{color:var(--fg);font-weight:500}
.meter{margin-top:14px}
.meter .top{display:flex;justify-content:space-between;font-size:.78rem}
.track{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:6px}
.fill{height:100%;border-radius:99px;transition:width .5s}
.state{font-family:var(--mono);font-size:.78rem}

.alert{margin-top:12px;padding:12px 14px;border-radius:8px;font-size:.88rem;border:1px solid}
.alert.warn{border-color:var(--warn);color:var(--warn)}
.alert.bad{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}

h2{font-family:var(--display);font-size:1.25rem;margin:24px 0 12px;font-weight:600}
.hint{font-size:.82rem;color:var(--muted);margin:-6px 0 12px}

.btn{background:var(--accent);color:#1a0d13;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#1a0d13}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.list{display:grid;gap:10px}
.mem{cursor:pointer;text-align:left;width:100%;display:block}
.mem .t{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mem .t b{font-weight:500;min-width:0;overflow-wrap:anywhere}
.mem .meta{font-size:.78rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}
.tag.imp{border-color:var(--accent-dim);color:var(--accent)}
.dots{letter-spacing:2px;color:var(--accent)}
.detail{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.9rem}
.detail p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:7em 1fr;gap:4px 10px;font-size:.8rem;color:var(--muted);margin-bottom:12px}
.kv span:nth-child(even){color:var(--fg)}
.sys{color:var(--bad)!important}

form.add{display:grid;gap:10px}
label{font-size:.8rem;color:var(--muted);display:grid;gap:4px}
input[type=text],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:5em;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
details.adder{margin-bottom:14px}
details.adder summary{cursor:pointer;list-style:none;display:inline-block}
details.adder summary::-webkit-details-marker{display:none}
details.adder[open] summary{margin-bottom:12px}

.mkt{display:grid;gap:0}
.mkt .r{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.mkt .r:last-child{border-bottom:0}
.up{color:var(--ok)}.down{color:var(--bad)}

.shop .card{display:grid;gap:6px}
.shop .card .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.shop .card p{margin:0;font-size:.85rem;color:var(--muted)}

.log .r{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.log .r small{display:block;color:var(--muted);font-size:.72rem;font-family:var(--mono)}
.empty{color:var(--muted);font-size:.9rem;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;cursor:pointer;color:var(--muted);font-size:.78rem;display:grid;justify-items:center;gap:2px}
nav.tabs button .g{font-family:var(--mono);font-size:.95rem}
nav.tabs button[aria-current="true"]{color:var(--accent)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:.88rem;max-width:calc(100% - 32px);text-align:center}

/* onboarding + sheets */
.onb{padding-block:48px}
.onb h1{font-family:var(--display);font-weight:900;font-size:2rem;margin:10px 0 8px}
.onb p{color:var(--muted);margin:0 0 20px}
.sheet{position:fixed;inset:0;z-index:25;background:color-mix(in srgb,var(--bg) 80%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:85vh;overflow:auto;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0 0 10px;font-family:var(--display)}
.sheet textarea{font-family:var(--mono);font-size:.75rem;min-height:7em}
.sheet section{padding-block:14px;border-bottom:1px solid var(--line)}
.sheet section:last-child{border-bottom:0}
.foot{font-size:.72rem;color:var(--muted);text-align:center;padding-block:28px}

/* instability */
body.unstable::after,body.critical::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
body.critical .bal{animation:jit 1.8s steps(1) infinite}
body.critical h2{animation:jit 2.6s steps(1) infinite}
@keyframes jit{0%,88%{transform:none}90%{transform:translateX(3px);opacity:.6}93%{transform:translateX(-2px)}}
@media (prefers-reduced-motion:reduce){body.critical .bal,body.critical h2{animation:none}.fill{transition:none}}
</style>
</head>

var SLOT=30*60*1000;
function slotNow(){return Math.floor(Date.now()/SLOT)}
function shopItems(){
  var sl=slotNow(),r=seed('shop'+sl),idx=POOL.map(function(_,i){return i});
  for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}
  var mem=(S&&S.memories)||[],got=[],tit=[];
  mem.forEach(function(m){if(m.src==='implant'){if(m.key)got.push(m.key);tit.push(m.title)}});
  function has(key,e){return got.indexOf(key)>=0||tit.indexOf(e[0])>=0}
  var out=[],rare=r()<0.15,k=Math.floor(r()*RARE.length);
  if(rare&&!has('r'+k,RARE[k]))out.push(mk(RARE[k],'r'+sl+'_'+k,true,sl,'r'+k));
  var sold=(S&&S.sold)||[];
  if(sold.length&&r()<0.3){var u=sold[Math.floor(r()*sold.length)];var it=mk([u.title,u.cat,u.int,u.note],'u'+sl+'_'+u.id,false,sl,null);it.used=u.id;out.push(it)}
  idx.filter(function(n){return !has('p'+n,POOL[n])}).slice(0,5-out.length).forEach(function(n){out.push(mk(POOL[n],'p'+sl+'_'+n,false,sl,'p'+n))});
  return out;
}
function mk(e,id,rare,sl,key){
  var v=0.85+seed(e[0]+sl)()*0.35;
  var p=(CATS[e[1]]||20000)*(0.6+e[2]*0.2)*7*v*(rare?2.5:1);
  return{id:id,t:e[0],c:e[1],i:e[2],d:e[3],p:Math.round(p/1000)*1000,rare:rare,key:key};
}
function countdown(){var ms=SLOT-(Date.now()%SLOT),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

function uid(){return Math.random().toString(36).slice(2,9)}
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function now(){return new Date().toISOString()}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function when(iso){var d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function seed(str){var h=1779033703;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return ((h^=h>>>16)>>>0)/4294967296}}
function dayKey(off){var d=new Date();d.setDate(d.getDate()-(off||0));return d.toISOString().slice(0,10)}
function factor(cat,off){return 0.8+seed(dayKey(off)+cat)()*0.45}
function price(m){
  var base=CATS[m.cat]||300;
  var p=base*(0.6+m.int*0.2)*factor(m.cat)*Math.pow(0.92,m.recalls||0);
  if(m.src==='implant')p*=0.35;
  return Math.max(900,p);
}
function stability(){
  var s=S.mood;S.memories.forEach(function(m){s+=m.int*(m.src==='implant'?0.8:1.5)});
  s-=Math.min(40,S.debt/36000);
  return Math.max(0,Math.min(100,Math.round(s)));
}
function stateOf(v){
  if(v>=50)return{k:'穩定',c:'var(--ok)'};
  if(v>=25)return{k:'波動',c:'var(--warn)'};
  if(v>=10)return{k:'失衡',c:'var(--bad)'};
  return{k:'壞帳',c:'var(--bad)'};
}

/* ---------- actions ---------- */
function find(id){for(var i=0;i<S.memories.length;i++)if(S.memories[i].id===id)return S.memories[i]}
function bind(){
  var app=document.getElementById('app');
  app.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;var d=b.dataset;
    if(d.tab){tab=d.tab;pending=null;open=null;render();window.scrollTo(0,0);return}
    if(b.id==='openSet'){openSheet(false);return}
    if(d.cancel){pending=null;render();return}
    if(d.open){open=open===d.open?null:d.open;pending=null;render();return}
    if(d.recall){var m=find(d.recall);m.recalls=(m.recalls||0)+1;save();render();toast('你回想了「'+m.title+'」。品相下降了一點。');return}
    if(d.dep){pending='dep'+d.dep;render();return}
    if(d.depok){
      var m2=find(d.depok),p=price(m2);
      S.memories=S.memories.filter(function(x){return x.id!==m2.id});
      if(m2.src==='own'||m2.orig){S.sold=(S.sold||[]).filter(function(x){return x.id!==m2.id});S.sold.push({id:m2.id,title:m2.title,cat:m2.cat,int:m2.int,note:m2.note||''});if(S.sold.length>60)S.sold.shift()}
      S.balance+=p;S.deposits=(S.deposits||0)+1;S.mood-=m2.int*4+2;log('上繳','上繳「'+m2.title+'」',p);
      if(S.deposits%3===0){var rest=S.memories.filter(function(x){return x.src==='own'&&!x.altered});if(rest.length){rest[Math.floor(Math.random()*rest.length)].altered=now()}}
      pending=null;open=null;save();render();toast('上繳完成，入帳 '+fmt(p)+' 元');return}
    if(d.buy){pending='buy'+d.buy;render();return}
    if(d.buyok){
      var it=shopItems().filter(function(x){return x.id===d.buyok})[0];if(!it){pending=null;render();toast('這項商品已下架');return}if(S.balance<it.p)return;
      S.balance-=it.p;if(it.used)S.sold=(S.sold||[]).filter(function(x){return x.id!==it.used});S.memories.push({id:uid(),title:it.t,cat:it.c,int:it.i,note:it.d,recalls:0,src:'implant',key:it.key||undefined,orig:!!it.used,created:now()});
      log('提領','提領植入「'+it.t+'」',-it.p);pending=null;save();render();toast('植入完成。你現在記得「'+it.t+'」了。');return}
    if(d.loan){pending='loan'+d.loan;render();return}
    if(d.loanok){var a=+d.loanok;S.balance+=a;S.debt+=a*(1+RATE);log('信貸','記憶信貸撥款',a);pending=null;save();render();toast('撥款完成');return}
    if(d.repay){
      var amt=d.repay==='all'?Math.min(S.balance,S.debt):Math.min(100000,S.balance,S.debt);
      if(amt<=0)return;S.balance-=amt;S.debt-=amt;if(S.debt<1)S.debt=0;log('還款','信貸還款',-amt);save();render();toast('已還款 '+fmt(amt)+' 元');return}
  };
  var f=document.getElementById('addForm');
  if(f){
    var r=document.getElementById('mInt');r.oninput=function(){document.getElementById('mIntV').textContent=r.value};
    f.onsubmit=function(e){e.preventDefault();var t=document.getElementById('mTitle').value.trim(),nt=document.getElementById('mNote').value.trim();if(!t||!nt){toast(!t?'請填寫標題':'請填寫描述');return}
      S.memories.unshift({id:uid(),title:t,cat:document.getElementById('mCat').value,int:+r.value,note:nt,recalls:0,src:'own',created:now()});
      save();render();toast('記憶已儲存')};
  }
}

  var code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S||{}))))}catch(e){}
  el.innerHTML='<div class="box">'+
    (importOnly?'':'<section><h3>匯出備份碼</h3><p class="hint" style="margin:0 0 8px">換裝置前先複製備份碼並自行保存。</p><textarea id="exp" readonly>'+code+'</textarea><div class="btns" style="margin-top:8px"><button class="btn ghost" type="button" id="copy">複製</button></div></section>')+
    '<section><h3>匯入備份碼</h3><textarea id="imp" placeholder="貼上備份碼"></textarea><div class="btns" style="margin-top:8px"><button class="btn ghost" type="button" id="doImp">匯入</button></div></section>'+
    (importOnly?'':'<section><h3>重設帳戶</h3><p class="hint" style="margin:0 0 8px">刪除這台裝置上的所有資料，無法復原。</p><div class="btns" id="resetBox"><button class="btn ghost" type="button" id="reset">重設帳戶</button></div></section>')+
    '<section><button class="btn" type="button" id="closeS">關閉</button></section></div>';
  document.body.appendChild(el);
  function close(){el.remove()}
  el.onclick=function(e){if(e.target===el)close()};
  el.querySelector('#closeS').onclick=close;
  var cp=el.querySelector('#copy');if(cp)cp.onclick=function(){var ta=el.querySelector('#exp');
    try{navigator.clipboard.writeText(ta.value).then(function(){toast('已複製')},function(){ta.select();toast('請長按全選後複製')})}catch(e){ta.select();toast('請長按全選後複製')}};
  el.querySelector('#doImp').onclick=function(){
    try{var o=JSON.parse(decodeURIComponent(escape(atob(el.querySelector('#imp').value.trim()))));if(!o||!o.name||!Array.isArray(o.memories))throw 0;if(typeof o.mood!=='number')o.mood=startMood();
      S=o;save();close();tab='lib';render();toast('已匯入「'+o.name+'」')}catch(e){toast('備份碼無法辨識，請確認是否完整貼上')}};
  var rs=el.querySelector('#reset');if(rs)rs.onclick=function(){
    el.querySelector('#resetBox').innerHTML='<button class="btn danger" type="button" id="resetOk">確定刪除</button><button class="btn ghost" type="button" id="resetNo">取消</button>';
    el.querySelector('#resetOk').onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}S=null;close();render()};
    el.querySelector('#resetNo').onclick=function(){close();openSheet(false)};
  };
}

setInterval(function(){if(!S||tab!=='shop')return;if(slotNow()!==shownSlot){pending=null;render();toast('商店已補貨');return}var c=document.getElementById('cd');if(c)c.textContent=countdown()},1000);
S=load();if(S&&typeof S.mood!=='number'){S.mood=startMood();save()}render();
})();
</script>
