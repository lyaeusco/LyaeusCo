<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>解憂者角色卡產生器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a HippoLink-style registration terminal; live card preview on one side, the form on the other, stacking on phones */
:root{
  color-scheme:dark;
  --bg:#121014;--panel:#1b181e;--panel2:#241f27;--fg:#efe8f1;--muted:#a59aa9;--line:#332c36;--accent:#e08aad;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:24px}
header h1{font-family:var(--display);font-weight:900;font-size:1.7rem;margin:0;letter-spacing:.04em}
header span{font-family:var(--mono);font-size:.75rem;letter-spacing:.18em;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:32px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.preview{position:sticky;top:16px;min-width:0}
@media (max-width:880px){.preview{position:static}}
canvas{width:100%;max-width:100%;aspect-ratio:3/4;display:block;background:#000}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--accent);color:#1a0d13;border:0;padding:11px 18px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.hint{font-size:.8rem;color:var(--muted)}
form{display:flex;flex-direction:column;gap:20px;min-width:0}
fieldset{border:1px solid var(--line);padding:16px;margin:0;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
legend{font-family:var(--mono);font-size:.75rem;letter-spacing:.18em;color:var(--accent);padding:0 6px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
input[type=text],textarea,select{background:var(--panel2);border:1px solid var(--line);padding:9px 11px;width:100%;color:var(--fg)}
textarea{resize:vertical;min-height:4.5em}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:block;text-align:center;border:1px solid var(--line);padding:9px 4px;cursor:pointer;color:var(--fg);font-size:.88rem;position:relative}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent);color:#1a0d13;font-weight:500}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.sw{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle;border:1px solid rgba(255,255,255,.3)}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline label{flex:1}
.count{font-family:var(--mono);font-size:.72rem;color:var(--muted);align-self:flex-end}
#out{margin-top:16px}
#out img{width:100%;display:block;border:1px solid var(--line)}
#out p{margin:8px 0 0}
.foot{margin-top:40px;font-size:.75rem;color:var(--muted);text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>角色卡產生器</h1>
    <span>解憂者有限公司 · HippoLink 登錄終端</span>
  </header>
  <div class="grid">
    <div class="preview">
      <canvas id="cv" width="1080" height="1440" aria-label="角色卡預覽"></canvas>
      <div class="actions">
        <button class="btn" type="button" id="dl">下載角色卡</button>
        <button class="btn ghost" type="button" id="reset">清空重填</button>
      </div>
      <p class="hint" id="dlhint">輸出尺寸 1080 × 1440，可以直接發 IG。</p>
      <div id="out" hidden><img id="outImg" alt="產生的角色卡圖片"><p class="hint">如果沒有自動下載：電腦請右鍵「另存圖片」，手機請長按圖片儲存。</p></div>
    </div>

    <form id="f" autocomplete="off">
      <fieldset>
        <legend>陣營</legend>
        <div class="seg">
          <label><input type="radio" name="faction" value="employee" id="fa1" checked><span class="sw" style="background:#e08aad"></span>解憂者員工</label>
          <label><input type="radio" name="faction" value="enforcer" id="fa2"><span class="sw" style="background:#146dda"></span>執法者</label>
          <label><input type="radio" name="faction" value="citizen" id="fa3"><span class="sw" style="background:#241f27"></span>一般市民</label>
          <label><input type="radio" name="faction" value="rebel" id="fa4"><span class="sw" style="background:#d9ff3f"></span>反抗者</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>立繪</legend>
        <label>上傳圖片<input type="file" id="img" accept="image/*"></label>
        <div class="row3">
          <label>縮放<input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
          <label>左右<input type="range" id="ox" min="-1" max="1" step="0.01" value="0"></label>
          <label>上下<input type="range" id="oy" min="-1" max="1" step="0.01" value="0"></label>
        </div>
        <p class="hint" style="margin:0">建議上傳直式圖片。圖片只在你的瀏覽器處理，不會上傳到任何地方。</p>
        <label>或用文字描述外觀<textarea id="look" maxlength="160" placeholder="沒有立繪時，這段文字會顯示在立繪區。例如：及肩黑髮，總穿著洗到褪色的灰色外套。"></textarea></label>
        <span class="count" id="lookC"></span>
        <button class="btn ghost" type="button" id="clearImg" style="align-self:flex-start">移除圖片，改用文字</button>
      </fieldset>

      <fieldset>
        <legend>基本資料</legend>
        <label>角色姓名<input type="text" id="name" maxlength="16" placeholder="例如：林予晴"></label>
        <div class="inline">
          <label>HippoLink ID<input type="text" id="hid" maxlength="16"></label>
          <button class="btn ghost" type="button" id="genId">隨機</button>
        </div>
        <div class="row">
          <label>年齡<input type="text" id="age" maxlength="10"></label>
          <label>性別<input type="text" id="gender" maxlength="10"></label>
          <label>身高<input type="text" id="height" maxlength="10"></label>
          <label>職業<input type="text" id="job" maxlength="12"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>記憶</legend>
        <span style="font-size:.82rem;color:var(--muted)">記憶存款狀態</span>
        <div class="seg seg4">
          <label><input type="radio" name="deposit" value="0" id="dp0">富裕</label>
          <label><input type="radio" name="deposit" value="1" id="dp1" checked>普通</label>
          <label><input type="radio" name="deposit" value="2" id="dp2">拮据</label>
          <label><input type="radio" name="deposit" value="3" id="dp3">負債</label>
        </div>
        <label>最珍惜、絕不出售的記憶<textarea id="memory" maxlength="40" placeholder="一句話描述這段記憶"></textarea></label>
        <span class="count" id="memC"></span>
      </fieldset>

      <fieldset>
        <legend>個性</legend>
        <div class="row3">
          <label>性格一<input type="text" id="t1" maxlength="6"></label>
          <label>性格二<input type="text" id="t2" maxlength="6"></label>
          <label>性格三<input type="text" id="t3" maxlength="6"></label>
        </div>
        <label>角色簡介<textarea id="bio" maxlength="90" placeholder="兩到三行，介紹角色的背景與目前的處境"></textarea></label>
        <span class="count" id="bioC"></span>
        <label>繪師／作者<input type="text" id="author" maxlength="20" placeholder="例如：@your_id"></label>
      </fieldset>
    </form>
  </div>
  <p class="foot">原創角色企劃《解憂者有限公司》 · 填寫內容只儲存在你的瀏覽器</p>
</div>

  // memory panel
  var MY=932;x.fillStyle=t.panel;x.fillRect(64,MY,952,176);
  x.fillStyle=t.panelAcc;x.font=font(400,20,MONO);x.letterSpacing='3px';x.fillText('最珍惜、絕不出售的記憶',96,MY+50);x.letterSpacing='0px';
  x.fillStyle=t.panelFg;x.font=font(600,32,SERIF);
  wrap(or(val('memory'),'[一句話描述這段記憶]'),888,2).forEach(function(l,n){x.fillText(l,96,MY+104+n*46)});
  // bio
  x.fillStyle=t.ink;x.font=font(400,26,SANS);
  wrap(or(val('bio'),'[角色簡介：兩到三行，介紹角色的背景與目前的處境。]'),952,4).forEach(function(l,n){x.fillText(l,64,1170+n*44)});
  // footer
  x.fillStyle=t.ink;x.font=font(400,20,MONO);x.letterSpacing='2px';
  x.fillText('#解憂者有限公司',64,1376);x.textAlign='right';x.fillText(or(val('author'),''),1016,1376);x.textAlign='left';x.letterSpacing='0px';
  $('lookC').textContent=$('look').value.length+' / 160';$('memC').textContent=$('memory').value.length+' / 40';$('bioC').textContent=$('bio').value.length+' / 90';
}

var pending=false;
function render(){
  if(pending)return;pending=true;
  requestAnimationFrame(function(){
    pending=false;
    var txt=fields.map(val).join('')+'外觀[]角色姓名立繪年齡性別身高職業記憶存款狀態富裕普通拮据負債性格一二三最珍惜絕不出售的一句話描述這段簡介兩到行介紹背景與目前處境解憂者有限公司卡員工執法社會秩序局一般市民反抗訊號已截獲未連線#…・';
    var loads=[font(900,76,'"Noto Serif TC"'),font(600,32,'"Noto Serif TC"'),font(400,26,'"Noto Sans TC"'),font(500,30,'"Noto Sans TC"'),font(400,22,'"IBM Plex Mono"')].map(function(f){
      try{return document.fonts.load(f,txt)}catch(e){return Promise.resolve()}});
    Promise.all(loads).catch(function(){}).then(draw);
  });
}

function save(){
  var o={faction:radio('faction'),deposit:radio('deposit')};fields.forEach(function(k){o[k]=$(k).value});
  try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}
}
function load(){
  var o=null;try{o=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!o){$('hid').value=genId();return}
  fields.forEach(function(k){if(o[k]!=null)$(k).value=o[k]});
  var f=document.querySelector('input[name="faction"][value="'+o.faction+'"]');if(f)f.checked=true;
  var d=document.querySelector('input[name="deposit"][value="'+o.deposit+'"]');if(d)d.checked=true;
  if(!$('hid').value)$('hid').value=genId();
}

$('f').addEventListener('input',function(){save();render()});
$('f').addEventListener('change',function(){save();render()});
$('f').addEventListener('submit',function(e){e.preventDefault()});
$('clearImg').onclick=function(){portrait=null;$('img').value='';render()};
$('genId').onclick=function(){$('hid').value=genId();save();render()};
$('img').onchange=function(){
  var file=this.files&&this.files[0];if(!file)return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){portrait=im;$('zoom').value=1;$('ox').value=0;$('oy').value=0;render()};im.src=r.result};r.readAsDataURL(file);
};
$('reset').onclick=function(){
  $('f').reset();portrait=null;$('img').value='';$('hid').value=genId();$('out').hidden=true;save();render();
};
$('dl').onclick=function(){
  draw();
  var url=cv.toDataURL('image/png'),name=(val('name')||'角色卡')+'_解憂者有限公司.png';
  $('outImg').src=url;$('out').hidden=false;
  try{var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
};
logo.onload=render;logo.src=LOGO;
load();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
})();
</script>
